name: 'psx_warehouse'
version: '1.0.0'
config-version: 2

profile: 'psx_warehouse'

model-paths: ["models"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  psx_warehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
