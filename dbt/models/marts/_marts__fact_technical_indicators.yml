version: 2

models:
  - name: fact_technical_indicators
    columns:
      - name: ticker_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_tickers')
              field: dbt_scd_id
      - name: symbol
        tests: [not_null]
      - name: date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date
      - name: max_drawdown_pct
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, date]
