version: 2

models:
  - name: fact_ohlcv
    columns:
      - name: ticker_key
        tests: [not_null, relationships: {to: ref('dim_tickers'), field: dbt_scd_id}]
      - name: date
        tests: [not_null, relationships: {to: ref('dim_date'), field: date}]
      - name: is_ticker_attrs_assumed
        tests: [not_null]
      - name: open
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: high
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: low
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: close
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: volume
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, date]

  - name: fact_restatement_history
    columns:
      - name: ticker_key
        tests: [not_null, relationships: {to: ref('dim_tickers'), field: dbt_scd_id}]
      - name: date
        tests: [not_null, relationships: {to: ref('dim_date'), field: date}]
      - name: restatement_count
        tests: [not_null, {dbt_utils.accepted_range: {min_value: 1}}]
      - name: is_ticker_attrs_assumed
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, date]

  - name: fact_index_membership
    columns:
      - name: index_name
        tests: [not_null, relationships: {to: ref('dim_indices'), field: index_name}]
      - name: ticker_key
        # dim_tickers is a snapshot with a bootstrap horizon (dbt_valid_from
        # of its earliest row = whenever the snapshot first ran). Per this
        # task's plain-join design (no as_of_ticker_join fallback), any
        # snapshot_date in index_constituents older than that horizon has no
        # possible match and legitimately lands NULL here. not_null is warn
        # (not error) so the gap is visible without failing the build.
        # relationships stays at default (error) severity - it already
        # excludes NULL children, so it guards real FK violations among the
        # matched rows without conflicting with the known NULL gap above.
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: ref('dim_tickers')
              field: dbt_scd_id
      - name: snapshot_date
        tests: [not_null, relationships: {to: ref('dim_date'), field: date}]
      - name: idx_weight
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: idx_point
        # IDX POINT is each stock's signed point-contribution to the index's
        # move (can be negative), not an index level - no non-negativity
        # constraint applies.
      - name: market_cap_m
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: freefloat_m
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: shares_m
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: current_index
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [index_name, symbol, snapshot_date]

  - name: fact_sector_daily
    columns:
      - name: sector_code
        tests: [not_null, relationships: {to: ref('dim_sectors'), field: sector_code}]
      - name: date
        tests: [not_null, relationships: {to: ref('dim_date'), field: date}]
      - name: advance
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: decline
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: unchanged
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: turnover
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: market_cap_b
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [sector_code, date]

  - name: fact_valuation_daily
    columns:
      - name: ticker_key
        # Unlike fact_index_membership's gap (a temporal bootstrap-horizon
        # effect from dim_tickers' snapshot only starting today), this NULL
        # set is a symbol-coverage gap between two independent PSX endpoints:
        # 108 of 745 stg_screener symbols (suffixed NC/XD/XB - non-convertible,
        # ex-dividend, ex-bonus corporate-action variants) have zero rows in
        # stg_symbols/dim_tickers at any date, so no as-of window could ever
        # match them. not_null is warn (not error) so the gap is visible
        # without failing the build. relationships stays at default (error)
        # severity - it already excludes NULL children, so it guards real FK
        # violations among the matched rows without conflicting with this
        # known gap.
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: ref('dim_tickers')
              field: dbt_scd_id
      - name: date
        tests: [not_null, relationships: {to: ref('dim_date'), field: date}]
      - name: market_cap
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: price
        tests: [{dbt_utils.accepted_range: {min_value: 0}}]
      - name: pe_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: -1000
              max_value: 1000
              config: {severity: warn}
      - name: dividend_yield
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              config: {severity: warn}
      - name: free_float
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              config: {severity: warn}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, date]
